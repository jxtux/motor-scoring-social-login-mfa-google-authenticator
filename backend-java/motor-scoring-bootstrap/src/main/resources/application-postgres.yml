spring:
  datasource:
    url: ${POSTGRES_JDBC_URL:jdbc:postgresql://postgres:5432/motor_scoring?sslmode=verify-full&sslrootcert=/app/certs/ca.crt}
    username: ${POSTGRES_USER:motor_scoring}
    password: ${POSTGRES_PASSWORD:motor_scoring}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
