spring:
  config:
    import: optional:classpath:application-iam.yml
  application:
    name: motor-scoring-crediticio
  profiles:
    default: postgres,api
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
      sasl.jaas.config: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME:motor-scoring-api}" password="${KAFKA_PASSWORD:changeit}";'
      ssl.truststore.location: ${KAFKA_TRUSTSTORE_LOCATION:/app/certs/client.truststore.jks}
      ssl.truststore.password: ${KAFKA_TRUSTSTORE_PASSWORD:changeit}
      ssl.truststore.type: JKS

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  kafka:
    concurrency: ${KAFKA_CONCURRENCY:1}
  outbox:
    fixed-delay-ms: ${OUTBOX_FIXED_DELAY_MS:1000}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}

server:
  port: ${SERVER_PORT:8443}
  ssl:
    enabled: ${SERVER_SSL_ENABLED:true}
    key-store: ${SERVER_SSL_KEY_STORE:/app/certs/api-keystore.p12}
    key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: motor-scoring-api
